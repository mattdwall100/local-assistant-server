[project]
name = "local-ai-assistant"
version = "0.1.0"
description = "Local-network AI assistant server and clients"
# Pydantic's native dependency chain in this repo is not yet reliable on Python 3.14.
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
